name: quran_app_android
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.5
  flutter_custom_clippers: ^2.1.0
  shared_preferences: ^2.1.2
  share_plus: ^10.1.4
  dio: ^5.2.1+1
#  audioplayers: ^4.1.0
  connectivity_plus: ^4.0.1
  readmore: ^2.2.0
  fluttertoast: ^8.2.12
  step_progress_indicator: ^1.0.2
  geolocator: ^13.0.1
  permission_handler: ^11.4.0
  intl: ^0.18.1
  flutter_local_notifications: ^17.0.2
  timezone: ^0.9.0

  sqflite: ^2.3.3+2
  path: ^1.9.0
  # flutter_qiblah: ^3.1.0+1
  lottie: ^2.6.0
  smooth_page_indicator: ^1.1.0
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  flutter_compass: ^0.8.1
  home_widget: ^0.7.0+1
  android_intent_plus: ^6.0.0
  flutter_timezone: ^5.1.0
  path_provider: ^2.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.3
  sqlite3: ^2.4.0
flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/images/json/
    - assets/db/
    - assets/fonts/qpc_v2/
    - assets/fonts/qpc_v1/
  fonts:
      - family: IconBroken
        fonts:
          - asset: assets/fonts/icons.ttf
      - family: Kitab
        fonts:
          - asset: assets/fonts/kitab.ttf
      - family: Quran
        fonts:
          - asset: assets/fonts/Al-QuranAlKareem.ttf
      - family: BalooBhaijaan2
        fonts:
          - asset: assets/fonts/BalooBhaijaan2-VariableFont_wght.ttf
      - family: uthman
        fonts:
          - asset: assets/fonts/UthmanicHafs1.otf
      - family: Cairo
        fonts:
          - asset: assets/fonts/Cairo-VariableFont_wght.ttf
      - family: Amiri
        fonts:
          - asset: assets/fonts/Amiri-Regular.ttf
          - asset: assets/fonts/Amiri-Bold.ttf
            weight: 700
      - family: SurahName
        fonts:
          - asset: assets/fonts/sura_names.ttf
